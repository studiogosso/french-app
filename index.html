<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>フランス語学習 v2.0</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22フランス語学習%22,%22short_name%22:%22French%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0a16%22,%22theme_color%22:%22%23ff6b9d%22}">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="フランス語学習 - フラッシュカード＆文法トレーナー">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08081a;--bg2:#0e0e28;--bg3:#161640;--bg4:#22224a;
  --text:#e4e4ff;--text2:#a8a8d0;--text3:#6a6a96;
  --accent:#ff6b9d;--accent2:#ff8bb8;--accent3:#e0557f;
  --green:#34d399;--yellow:#fbbf24;--red:#f87171;--cyan:#22d3ee;--blue:#60a5fa;--purple:#a78bfa;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
  --glass-heavy:rgba(255,255,255,0.07);
  --card-radius:16px;--transition:0.25s ease;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --glow-accent:rgba(255,107,157,0.15);
  --glow-green:rgba(52,211,153,0.15);
}
html{font-size:15px;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  overflow-x:hidden;padding-bottom:calc(76px + var(--safe-bottom));
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 600px 400px at 20% 10%, rgba(255,107,157,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 500px 300px at 80% 90%, rgba(96,165,250,0.05) 0%, transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;border:none;background:none;color:inherit;outline:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* ===== Glassmorphism Helpers ===== */
.glass{
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
}
.glass-heavy{
  background:var(--glass-heavy);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.1);
}

/* ===== Header ===== */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(8,8,26,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,107,157,0.1);
}
.header-title{font-size:1.15rem;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap;flex:1;
}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.streak-badge{
  display:flex;align-items:center;gap:4px;padding:5px 12px;
  border-radius:12px;
  background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.15);
  font-size:0.75rem;font-weight:700;color:var(--yellow);
}

/* ===== Daily Goal Bar ===== */
.daily-goal-bar{
  padding:8px 16px;
  display:flex;align-items:center;gap:8px;font-size:0.75rem;
}
.daily-goal-bar .goal-text{color:var(--accent);font-weight:700;white-space:nowrap}
.daily-goal-bar .goal-text.done{color:var(--green)}
.daily-goal-bar .goal-track{flex:1;height:4px;border-radius:2px;background:var(--bg4);overflow:hidden}
.daily-goal-bar .goal-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width 0.4s ease}
.daily-goal-bar .goal-fill.done{background:var(--green)}
.daily-goal-bar .goal-pct{font-size:0.65rem;color:var(--text3)}

/* ===== Bottom Nav ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(8,8,26,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,107,157,0.08);
  display:flex;padding:6px 0 calc(6px + var(--safe-bottom));
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;font-size:0.6rem;color:var(--text3);
  transition:var(--transition);position:relative;
}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{
  content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:20px;height:3px;border-radius:2px;background:var(--accent);
  box-shadow:0 0 8px var(--glow-accent);
}
.nav-btn .nav-icon{font-size:1.3rem;line-height:1}
.nav-btn:active{transform:scale(0.9)}

/* ===== Sections ===== */
.section{display:none;padding:12px 16px 24px;animation:fadeIn 0.3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Search Bar ===== */
.search-bar{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-radius:12px;background:var(--glass);
  border:1px solid var(--glass-border);margin-bottom:12px;
  transition:var(--transition);
}
.search-bar:focus-within{border-color:rgba(255,107,157,0.3);box-shadow:0 0 0 3px rgba(255,107,157,0.08)}
.search-bar input{flex:1;font-size:0.85rem;background:none;color:var(--text)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar .search-icon{color:var(--text3);font-size:0.9rem;flex-shrink:0}
.search-bar .search-clear{
  color:var(--text3);font-size:0.85rem;padding:2px 6px;border-radius:6px;
  background:var(--bg4);display:none;flex-shrink:0;
}
.search-bar .search-clear.visible{display:block}

/* ===== Filter Chips ===== */
.chip-bar{
  display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.chip-bar::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:0.78rem;font-weight:600;
  background:var(--glass);color:var(--text2);transition:var(--transition);
  border:1px solid var(--glass-border);white-space:nowrap;
}
.chip.active{
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px var(--glow-accent);
}
.chip:active{transform:scale(0.95)}

/* ===== Flashcard ===== */
.card-container{perspective:1000px;width:100%;max-width:400px;margin:0 auto}
.flashcard{
  position:relative;width:100%;aspect-ratio:3/2;cursor:pointer;
  transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);
}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:var(--card-radius);padding:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  background:var(--glass-heavy);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.flashcard-front{
  background:linear-gradient(135deg,rgba(14,14,40,0.8),rgba(22,22,64,0.6));
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05);
}
.flashcard-back{
  background:linear-gradient(135deg,rgba(26,16,64,0.8),rgba(14,14,40,0.6));
  border:1px solid rgba(167,139,250,0.15);
  box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05);
  transform:rotateY(180deg);
}
.flashcard-word{font-size:2rem;font-weight:800;margin-bottom:8px;line-height:1.2}
.flashcard-phonetic{font-size:0.9rem;color:var(--accent2);margin-bottom:8px;font-style:italic}
.flashcard-translation{font-size:1.1rem;color:var(--text2);margin-bottom:4px}
.flashcard-example{font-size:0.8rem;color:var(--text3);margin-top:8px;line-height:1.4}
.flashcard-category{
  position:absolute;top:12px;left:12px;padding:3px 10px;border-radius:8px;
  font-size:0.65rem;font-weight:700;
  background:rgba(255,107,157,0.15);border:1px solid rgba(255,107,157,0.1);
  color:var(--accent);
}
.flashcard-num{
  position:absolute;top:12px;right:12px;font-size:0.7rem;color:var(--text3);
}
.flashcard-bookmark{
  position:absolute;bottom:12px;right:12px;font-size:1.1rem;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:rgba(255,255,255,0.05);
  transition:var(--transition);z-index:2;
}
.flashcard-bookmark:active{transform:scale(0.85)}
.flashcard-bookmark.bookmarked{color:var(--yellow);background:rgba(251,191,36,0.15)}
.card-controls{
  display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;
}
.card-btn{
  padding:10px 18px;border-radius:12px;font-size:0.82rem;font-weight:600;
  transition:var(--transition);display:flex;align-items:center;gap:6px;
  border:1px solid transparent;
}
.card-btn:active{transform:scale(0.93)}
.card-btn.know{background:rgba(52,211,153,0.1);color:var(--green);border-color:rgba(52,211,153,0.15)}
.card-btn.unsure{background:rgba(251,191,36,0.1);color:var(--yellow);border-color:rgba(251,191,36,0.15)}
.card-btn.dunno{background:rgba(248,113,113,0.1);color:var(--red);border-color:rgba(248,113,113,0.15)}
.card-btn.speak{background:rgba(255,107,157,0.1);color:var(--accent);border-color:rgba(255,107,157,0.15)}
.card-btn.nav{background:var(--glass);color:var(--text2);border-color:var(--glass-border)}

/* ===== Progress Bar ===== */
.progress-bar{
  width:100%;height:4px;border-radius:2px;background:var(--bg4);margin:12px 0;overflow:hidden;
}
.progress-bar .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width 0.4s ease}

/* ===== Quiz ===== */
.quiz-question{
  background:var(--glass-heavy);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--card-radius);padding:24px;
  border:1px solid var(--glass-border);margin-bottom:16px;text-align:center;
  box-shadow:0 4px 24px rgba(0,0,0,0.2);
}
.quiz-prompt{font-size:0.85rem;color:var(--text2);margin-bottom:8px}
.quiz-word{font-size:1.8rem;font-weight:800;margin-bottom:4px}
.quiz-hint{font-size:0.8rem;color:var(--text3);font-style:italic}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.quiz-opt{
  padding:14px 18px;border-radius:12px;
  background:var(--glass);border:1px solid var(--glass-border);
  font-size:0.95rem;text-align:left;
  transition:var(--transition);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.quiz-opt:active{transform:scale(0.98)}
.quiz-opt.correct{background:rgba(52,211,153,0.12);border-color:var(--green);color:var(--green);box-shadow:0 0 12px var(--glow-green)}
.quiz-opt.wrong{background:rgba(248,113,113,0.12);border-color:var(--red);color:var(--red)}
.quiz-opt.disabled{pointer-events:none}
.quiz-input-wrap{margin-bottom:16px}
.quiz-input{
  width:100%;padding:14px 18px;border-radius:12px;
  background:var(--glass);border:1px solid var(--glass-border);
  font-size:1rem;color:var(--text);
  transition:var(--transition);
}
.quiz-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,157,0.1)}
.quiz-input.correct{border-color:var(--green);background:rgba(52,211,153,0.08)}
.quiz-input.wrong{border-color:var(--red);background:rgba(248,113,113,0.08)}
.quiz-result{
  text-align:center;padding:10px;border-radius:12px;font-size:0.85rem;font-weight:600;margin-bottom:12px;
}
.quiz-result.correct{background:rgba(52,211,153,0.08);color:var(--green);border:1px solid rgba(52,211,153,0.12)}
.quiz-result.wrong{background:rgba(248,113,113,0.08);color:var(--red);border:1px solid rgba(248,113,113,0.12)}
.quiz-score{
  text-align:center;font-size:0.8rem;color:var(--text3);margin-bottom:12px;
}
.quiz-next-btn{
  width:100%;padding:14px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  color:#fff;font-weight:700;font-size:0.95rem;transition:var(--transition);
  box-shadow:0 4px 16px var(--glow-accent);
}
.quiz-next-btn:active{transform:scale(0.97)}
.quiz-mode-bar{display:flex;gap:8px;margin-bottom:16px}
.quiz-mode-btn{
  flex:1;padding:10px;border-radius:12px;font-size:0.8rem;font-weight:600;
  background:var(--glass);color:var(--text2);text-align:center;
  transition:var(--transition);border:1px solid var(--glass-border);
}
.quiz-mode-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px var(--glow-accent);
}

/* ===== Conjugation ===== */
.conj-verb-card{
  background:var(--glass-heavy);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--card-radius);padding:20px;
  border:1px solid var(--glass-border);margin-bottom:12px;
  box-shadow:0 4px 24px rgba(0,0,0,0.2);
}
.conj-verb-title{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.conj-verb-meaning{font-size:0.85rem;color:var(--text2);margin-bottom:12px}
.conj-tense-label{font-size:0.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.conj-table{width:100%;border-collapse:collapse}
.conj-table td{padding:8px 10px;font-size:0.85rem;border-bottom:1px solid rgba(255,255,255,0.04)}
.conj-table td:first-child{color:var(--text3);width:80px;font-weight:600}
.conj-table td:last-child{color:var(--text)}
.conj-input{
  width:100%;padding:8px 12px;border-radius:8px;
  background:var(--glass);border:1px solid var(--glass-border);
  color:var(--text);font-size:0.85rem;transition:var(--transition);
}
.conj-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,107,157,0.1)}
.conj-input.correct{border-color:var(--green);background:rgba(52,211,153,0.08)}
.conj-input.wrong{border-color:var(--red);background:rgba(248,113,113,0.08)}
.conj-check-btn{
  margin-top:12px;width:100%;padding:12px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  color:#fff;font-weight:700;font-size:0.9rem;
  box-shadow:0 4px 16px var(--glow-accent);
}
.conj-tense-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

/* ===== Daily Phrases ===== */
.phrase-card{
  background:var(--glass-heavy);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--card-radius);padding:20px;
  border:1px solid var(--glass-border);margin-bottom:12px;position:relative;
  animation:cardIn 0.3s ease both;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.phrase-french{font-size:1.2rem;font-weight:700;margin-bottom:4px;padding-right:44px}
.phrase-phonetic{font-size:0.82rem;color:var(--accent2);font-style:italic;margin-bottom:6px}
.phrase-japanese{font-size:0.9rem;color:var(--text2);margin-bottom:4px}
.phrase-context{font-size:0.75rem;color:var(--text3);line-height:1.4}
.phrase-speak{
  position:absolute;top:16px;right:16px;width:38px;height:38px;
  border-radius:50%;background:rgba(255,107,157,0.1);
  border:1px solid rgba(255,107,157,0.12);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  color:var(--accent);transition:var(--transition);
}
.phrase-speak:active{transform:scale(0.85)}

/* ===== Stats ===== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{
  background:var(--glass-heavy);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--card-radius);padding:16px;
  border:1px solid var(--glass-border);text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
}
.stat-value{font-size:1.8rem;font-weight:800;margin-bottom:4px}
.stat-value.pink{color:var(--accent)}
.stat-value.green{color:var(--green)}
.stat-value.yellow{color:var(--yellow)}
.stat-value.blue{color:var(--blue)}
.stat-label{font-size:0.75rem;color:var(--text3)}
.stat-section-title{font-size:0.9rem;font-weight:700;margin:16px 0 8px;color:var(--text2)}
.stat-bar-row{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
  font-size:0.8rem;
}
.stat-bar-label{width:80px;color:var(--text3);flex-shrink:0}
.stat-bar-track{flex:1;height:8px;border-radius:4px;background:var(--bg4);overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.stat-bar-val{width:40px;text-align:right;color:var(--text2);font-weight:600}
.action-btn-row{display:flex;gap:8px;margin-top:16px}
.action-btn{
  flex:1;padding:12px;border-radius:12px;font-size:0.82rem;font-weight:600;
  background:var(--glass);border:1px solid var(--glass-border);
  color:var(--text2);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:var(--transition);
}
.action-btn:active{transform:scale(0.97)}
.reset-btn{
  margin-top:20px;width:100%;padding:12px;border-radius:12px;
  background:rgba(248,113,113,0.06);color:var(--red);font-weight:600;
  font-size:0.85rem;border:1px solid rgba(248,113,113,0.12);
  transition:var(--transition);
}
.reset-btn:active{transform:scale(0.97)}

/* ===== Weak Words ===== */
.weak-section{margin-top:16px}
.weak-title{font-size:0.85rem;font-weight:700;color:var(--red);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.weak-item{
  display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.03);font-size:0.78rem;
}
.weak-drill-btn{
  margin-top:10px;padding:10px 16px;border-radius:12px;
  background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.12);
  color:var(--red);font-size:0.8rem;font-weight:600;width:100%;
  transition:var(--transition);
}
.weak-drill-btn:active{transform:scale(0.97)}

/* ===== Bookmark List ===== */
.bookmark-section{margin-top:16px}
.bookmark-title{font-size:0.9rem;font-weight:700;color:var(--yellow);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bookmark-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);
  margin-bottom:6px;font-size:0.82rem;
}
.bookmark-item .bk-fr{font-weight:700;color:var(--accent);flex:1}
.bookmark-item .bk-ja{color:var(--text2);font-size:0.75rem}
.bookmark-item .bk-remove{
  color:var(--text3);font-size:0.75rem;padding:4px 8px;border-radius:6px;
  background:var(--bg4);transition:var(--transition);
}
.bookmark-empty{text-align:center;padding:20px;color:var(--text3);font-size:0.82rem}

/* ===== Misc ===== */
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.section-subtitle{font-size:0.8rem;color:var(--text3);margin-bottom:12px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:0.9rem}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:10px 20px;border-radius:12px;
  background:rgba(8,8,26,0.95);border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);font-size:0.82rem;font-weight:600;

<!-- Header -->
<div class="header">

  </div>
</div>

<!-- Daily Goal -->
<div class="daily-goal-bar" id="dailyGoalBar">

  <span class="goal-pct" id="goalPct">0%</span>
</div>

<!-- Sections -->
<div class="section active" id="secFlashcard">

  <div class="chip-bar" id="fcCategoryBar"></div>
  <div class="progress-bar"><div class="fill" id="fcProgress"></div></div>
  <div class="card-container">
    <div class="flashcard" id="flashcard" onclick="flipCard(event)">
      <div class="flashcard-face flashcard-front">
        <div class="flashcard-category" id="fcCat"></div>
        <div class="flashcard-num" id="fcNum"></div>
        <div class="flashcard-word" id="fcWordFront"></div>
        <div class="flashcard-phonetic" id="fcPhonetic"></div>
        <div class="flashcard-example" id="fcExampleFront"></div>
        <button class="flashcard-bookmark" id="fcBookmark" onclick="toggleBookmark(event)">☆</button>

        <div class="flashcard-translation" id="fcTranslation"></div>

        <div class="flashcard-example" id="fcExampleBack"></div>
      </div>
    </div>
  </div>
  <div class="card-controls">
    <button class="card-btn speak" onclick="speakWord()">🔊 発音</button>
  </div>
  <div class="card-controls">
    <button class="card-btn dunno" onclick="rateCard(1)">😕 わからない</button>
    <button class="card-btn unsure" onclick="rateCard(3)">🤔 あいまい</button>
    <button class="card-btn know" onclick="rateCard(5)">✅ 覚えた</button>
  </div>
  <div class="card-controls">
    <button class="card-btn nav" onclick="prevCard()">◀ 前へ</button>
    <button class="card-btn nav" onclick="nextCard()">次へ ▶</button>
  </div>
  <div class="kbd-hints">
    <span><span class="kbd">←</span><span class="kbd">→</span> 移動</span>
    <span><span class="kbd">Space</span> めくる</span>
    <span><span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span> 評価</span>
    <span><span class="kbd">S</span> 発音</span>
  </div>
</div>

<div class="section" id="secQuiz">
  <div class="section-title">クイズ</div>
  <div class="section-subtitle">知識をテストしよう</div>

    <button class="quiz-mode-btn active" onclick="setQuizMode('choice')">選択式</button>
    <button class="quiz-mode-btn" onclick="setQuizMode('fill')">記入式</button>
  </div>
  <div class="chip-bar" id="quizCategoryBar"></div>
  <div class="quiz-score" id="quizScore">正解: 0 / 0</div>
  <div id="quizArea"></div>
</div>

<div class="section" id="secConj">
  <div class="section-title">活用練習</div>
  <div class="section-subtitle">動詞の活用を練習する</div>
  <div class="chip-bar" id="conjVerbBar"></div>
  <div class="conj-tense-chips" id="conjTenseBar"></div>
  <div id="conjArea"></div>
</div>

<div class="section" id="secPhrase">
  <div class="section-title">今日のフレーズ</div>
  <div class="section-subtitle" id="phraseDate"></div>
  <div id="phraseArea"></div>
</div>

<div class="section" id="secStats">
  <div class="section-title">学習状況</div>
  <div class="section-subtitle">あなたの進捗</div>

  <div id="categoryStats"></div>
  <div id="bookmarkSection"></div>
  <div id="weakWordsSection"></div>
  <div class="action-btn-row">

</div>

<!-- Bottom Nav -->
<div class="bottom-nav">

// ===== SM-2 ALGORITHM =====
function getSR(wordKey){
  if(!progress[wordKey]) progress[wordKey] = {ef:2.5,interval:1,reps:0,nextReview:0,seen:false,mastered:false};
  return progress[wordKey];
}
function updateSR(wordKey, quality){
  const sr = getSR(wordKey);
  sr.seen = true;
  if(quality >= 3){
    if(sr.reps === 0) sr.interval = 1;
    else if(sr.reps === 1) sr.interval = 6;
    else sr.interval = Math.round(sr.interval * sr.ef);
    sr.reps++;
  } else {
    sr.reps = 0;
    sr.interval = 1;
  }
  sr.ef = Math.max(1.3, sr.ef + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  sr.nextReview = Date.now() + sr.interval * 86400000;
  sr.mastered = sr.reps >= 4 && sr.ef >= 2.0;
  progress[wordKey] = sr;
  saveProgress();
}
function saveProgress(){
  localStorage.setItem('fr_progress', JSON.stringify(progress));
}

// ===== BOOKMARKS =====
function isBookmarked(fr){
  return bookmarks.includes(fr);
}
function toggleBookmark(e){
  e.stopPropagation();
  const cards = getFilteredVocab();
  if(!cards.length) return;
  const w = cards[fcIndex];
  if(isBookmarked(w.fr)){
    bookmarks = bookmarks.filter(b=>b!==w.fr);
    showToast('ブックマーク解除');
  } else {
    bookmarks.push(w.fr);
    showToast('ブックマークに追加');
  }
  localStorage.setItem('fr_bookmarks', JSON.stringify(bookmarks));
  updateBookmarkUI();
}
function updateBookmarkUI(){
  const cards = getFilteredVocab();
  if(!cards.length) return;
  const w = cards[fcIndex];
  const btn = document.getElementById('fcBookmark');
  if(isBookmarked(w.fr)){
    btn.textContent = '★';
    btn.classList.add('bookmarked');
  } else {
    btn.textContent = '☆';
    btn.classList.remove('bookmarked');
  }
}

// ===== STREAK =====
function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(streakData.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(streakData.lastDate === yesterday){
    streakData.count++;
  } else if(streakData.lastDate !== today){
    streakData.count = 1;
  }
  streakData.lastDate = today;
  localStorage.setItem('fr_streak', JSON.stringify(streakData));
  document.getElementById('streakCount').textContent = streakData.count;
}

// ===== DAILY GOAL =====
function updateDailyGoal(){
  const today = new Date().toISOString().slice(0,10);
  if(dailyGoal.date !== today){
    dailyGoal = {target: dailyGoal.target || 10, date: today, studied: 0};
  }
  localStorage.setItem('fr_daily_goal', JSON.stringify(dailyGoal));
  renderDailyGoalUI();
}
function renderDailyGoalUI(){
  const pct = Math.min(100, Math.round(dailyGoal.studied / dailyGoal.target * 100));
  const done = pct >= 100;
  document.getElementById('goalText').textContent = `${done?'✓':'🎯'} ${dailyGoal.studied}/${dailyGoal.target}語`;
  document.getElementById('goalText').className = 'goal-text' + (done?' done':'');
  document.getElementById('goalFill').style.width = pct+'%';
  document.getElementById('goalFill').className = 'goal-fill' + (done?' done':'');
  document.getElementById('goalPct').textContent = pct+'%';
}
function incrementDailyGoal(){
  const today = new Date().toISOString().slice(0,10);
  if(dailyGoal.date !== today){
    dailyGoal = {target: dailyGoal.target || 10, date: today, studied: 0};
  }
  dailyGoal.studied++;
  localStorage.setItem('fr_daily_goal', JSON.stringify(dailyGoal));
  renderDailyGoalUI();
}

  let list = VOCAB;
  if(fcCategory!=='すべて' && fcCategory!=='ブックマーク'){
    list = list.filter(v=>v.cat===fcCategory);
  }
  if(fcCategory==='ブックマーク'){
    list = VOCAB.filter(v=>bookmarks.includes(v.fr));
  }
  if(fcSearchQuery){
    const q = fcSearchQuery.toLowerCase();
    list = list.filter(v=>
      v.fr.toLowerCase().includes(q) ||
      v.ja.includes(q) ||
      v.ph.includes(q)
    );
  }
  return list;
}

  document.getElementById('fcCatBack').textContent = w.cat;

function getQuizPool(){

function renderQuiz(){
  // Weak drill mode
  if(_weakDrillActive && _weakDrillPool && _weakDrillPool.length >= 4){

  }
  _weakDrillActive = false;

        ${options.map(o=>`<button class="quiz-opt" onclick="checkQuizChoice(this,'${escQ(word.fr)}','${escQ(o.fr)}')">${direction==='fr2ja'?o.ja:o.fr}</button>`).join('')}

    area.innerHTML = `
      <div class="quiz-question">
        <div class="quiz-prompt">${direction==='fr2ja'?'日本語訳を入力してください':'フランス語を入力してください'}</div>
        <div class="quiz-word">${direction==='fr2ja'?word.fr:word.ja}</div>

      </div>
      <div class="quiz-input-wrap">
        <input class="quiz-input" id="quizFillInput" placeholder="${direction==='fr2ja'?'日本語で入力...':'フランス語で入力...'}"
          onkeydown="if(event.key==='Enter')checkQuizFill('${escQ(direction==='fr2ja'?word.ja:word.fr)}','${direction}')">
      </div>
      <button class="quiz-next-btn" onclick="checkQuizFill('${escQ(direction==='fr2ja'?word.ja:word.fr)}','${direction}')" id="quizCheckBtn">確認</button>
      <div id="quizResult"></div>
      <button class="quiz-next-btn" onclick="renderQuiz()" style="display:none;margin-top:8px" id="quizNextBtn">次の問題 ▶</button>
    `;
    setTimeout(()=>{const inp=document.getElementById('quizFillInput');if(inp)inp.focus()},100);
  }
  document.getElementById('quizScore').textContent = `正解: ${quizStats.correct} / ${quizStats.total}`;
}
function escQ(s){return s.replace(/'/g,"\\'")}
function unescQ(s){return s.replace(/\\'/g,"'")}
function checkQuizChoice(btn, correctFr, selectedFr){
  const isCorrect = correctFr === selectedFr;
  quizStats.total++;
  if(isCorrect) quizStats.correct++;
  localStorage.setItem('fr_quiz', JSON.stringify(quizStats));
  // Track weak words
  trackWeakWord(unescQ(correctFr), isCorrect);
  document.querySelectorAll('.quiz-opt').forEach(b=>{
    b.classList.add('disabled');
    const match = b.getAttribute('onclick').match(/,'([^']*)'\)/);
    if(match && match[1] === correctFr) b.classList.add('correct');
  });
  if(!isCorrect) btn.classList.add('wrong');
  const correctWord = VOCAB.find(v=>v.fr===unescQ(correctFr));
  const correctDisplay = correctWord ? correctWord.ja : '';
  const res = document.getElementById('quizResult');
  res.innerHTML = `<div class="quiz-result ${isCorrect?'correct':'wrong'}">${isCorrect?'正解！':'不正解 — 正解: '+correctDisplay}</div>`;
  document.getElementById('quizNextBtn').style.display = 'block';
  document.getElementById('quizScore').textContent = `正解: ${quizStats.correct} / ${quizStats.total}`;
  updateStreak();
  if(correctWord) updateSR(correctWord.fr, isCorrect?4:1);
}
function checkQuizFill(answer, direction){
  const inp = document.getElementById('quizFillInput');
  if(!inp || inp.disabled) return;
  const val = inp.value.trim();
  if(!val) return;
  const correct = unescQ(answer);
  const normalize = s => s.toLowerCase().replace(/[\s\u3000]/g,'').replace(/[（）()]/g,'').replace(/[\u3041-\u3096]/g,m=>String.fromCharCode(m.charCodeAt(0)+0x60));
  const isCorrect = normalize(val) === normalize(correct) || val.toLowerCase() === correct.toLowerCase();
  quizStats.total++;
  if(isCorrect) quizStats.correct++;
  localStorage.setItem('fr_quiz', JSON.stringify(quizStats));
  // Track weak words
  const currentWord = VOCAB.find(v => (direction==='fr2ja' ? v.ja : v.fr) === correct);
  if(currentWord) trackWeakWord(currentWord.fr, isCorrect);
  inp.classList.add(isCorrect?'correct':'wrong');
  inp.disabled = true;
  const res = document.getElementById('quizResult');
  res.innerHTML = `<div class="quiz-result ${isCorrect?'correct':'wrong'}">${isCorrect?'正解！':'不正解 — 正解: '+correct}</div>`;
  const checkBtn = document.getElementById('quizCheckBtn');
  if(checkBtn) checkBtn.style.display = 'none';
  document.getElementById('quizNextBtn').style.display = 'block';
  document.getElementById('quizScore').textContent = `正解: ${quizStats.correct} / ${quizStats.total}`;
  updateStreak();
  if(currentWord) updateSR(currentWord.fr, isCorrect?4:1);
}

// ===== WEAK WORDS =====
function trackWeakWord(frWord, isCorrect){
  if(!isCorrect){
    weakWords[frWord] = (weakWords[frWord] || 0) + 1;
  } else {
    if(weakWords[frWord]) weakWords[frWord] = Math.max(0, weakWords[frWord] - 1);
    if(weakWords[frWord] === 0) delete weakWords[frWord];
  }
  localStorage.setItem('fr_weak_words', JSON.stringify(weakWords));
}
function startWeakWordsDrill(){
  const weakFrs = Object.entries(weakWords).filter(([k,v])=>v>=2).map(([k])=>k);
  if(weakFrs.length < 4){
    showToast('苦手単語が4語以上必要です');
    return;
  }
  _weakDrillPool = VOCAB.filter(v => weakFrs.includes(v.fr));
  _weakDrillActive = true;
  switchTab('Quiz');
}
function renderWeakDrillQuiz(){
  const pool = _weakDrillPool;

  const idx = Math.floor(Math.random()*pool.length);

  const wrongPool = pool.filter((_,i)=>i!==idx);
  const wrongs = shuffle(wrongPool).slice(0,3);
  const options = shuffle([word,...wrongs]);
  area.innerHTML = `
    <div style="text-align:center;margin-bottom:10px;font-size:0.75rem;color:var(--red);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">

    </div>
    <div class="quiz-question">
      <div class="quiz-prompt">${direction==='fr2ja'?'この単語の意味は？':'この意味のフランス語は？'}</div>
      <div class="quiz-word">${direction==='fr2ja'?word.fr:word.ja}</div>
      <div class="quiz-hint">${direction==='fr2ja'?word.ph:''}</div>
    </div>
    <div class="quiz-options">
      ${options.map(o=>`<button class="quiz-opt" onclick="checkQuizChoice(this,'${escQ(word.fr)}','${escQ(o.fr)}')">${direction==='fr2ja'?o.ja:o.fr}</button>`).join('')}

    <div id="quizResult"></div>
    <button class="quiz-next-btn" onclick="renderQuiz()" style="display:none" id="quizNextBtn">次の問題 ▶</button>
  `;
  document.getElementById('quizScore').textContent = `正解: ${quizStats.correct} / ${quizStats.total}`;
}

function checkConj(){
  document.querySelectorAll('.conj-input').forEach(inp=>{
    const answer = inp.dataset.answer;
    const val = inp.value.trim().toLowerCase();
    const cleanAnswer = answer.replace(/\(.*?\)/g,'').trim().toLowerCase();
    const isCorrect = val === cleanAnswer || val === answer.toLowerCase();
    inp.classList.add(isCorrect?'correct':'wrong');
    if(!isCorrect) inp.value = inp.value + ' → ' + answer;
    inp.disabled = true;
  });
  updateStreak();
}
function speakConj(){

  const v = CONJ_VERBS[conjVerb];

  const text = PRONOUNS.map(p=>`${p} ${conj[p]}`).join('. ');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.75;
  speechSynthesis.speak(u);
}

  const area = document.getElementById('phraseArea');
  const today = new Date();
  document.getElementById('phraseDate').textContent = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
  const dayIndex = Math.floor(today.getTime()/86400000) % DAILY_PHRASES.length;
  const phrases = [];
  for(let i=0;i<5;i++){
    phrases.push(DAILY_PHRASES[(dayIndex+i)%DAILY_PHRASES.length]);
  }
  area.innerHTML = phrases.map((p,i)=>`
    <div class="phrase-card" style="animation-delay:${i*0.06}s">
      <button class="phrase-speak" onclick="speakPhrase(this,'${p.fr.replace(/'/g,"\\'")}')">🔊</button>
      <div class="phrase-french">${p.fr}</div>
      <div class="phrase-phonetic">${p.ph}</div>
      <div class="phrase-japanese">${p.ja}</div>
      <div class="phrase-context">💡 ${p.ctx}</div>
    </div>
  `).join('');
}
function speakPhrase(btn, text){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\\'/g,"'"));
    u.lang = 'fr-FR';
    u.rate = 0.8;
    speechSynthesis.speak(u);
  }
}

// ===== STATS =====
function renderStats(){
  const mastered = VOCAB.filter(v=>getSR(v.fr).mastered).length;
  const seen = VOCAB.filter(v=>getSR(v.fr).seen).length;
  const pct = quizStats.total > 0 ? Math.round(quizStats.correct/quizStats.total*100) : 0;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statQuizScore').textContent = pct+'%';
  document.getElementById('statStreak').textContent = streakData.count;
  document.getElementById('statTotal').textContent = seen;
  // Category breakdown
  const catStats = document.getElementById('categoryStats');
  const colors = ["#ff6b9d","#fbbf24","#22d3ee","#a78bfa","#34d399","#f97316","#60a5fa","#c084fc"];
  catStats.innerHTML = CATEGORIES.map((cat,i)=>{
    const catWords = VOCAB.filter(v=>v.cat===cat);
    const catMastered = catWords.filter(v=>getSR(v.fr).mastered).length;
    const p = Math.round(catMastered/catWords.length*100);
    return `<div class="stat-bar-row">
      <div class="stat-bar-label">${cat}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${p}%;background:${colors[i%colors.length]}"></div></div>
      <div class="stat-bar-val">${catMastered}/${catWords.length}</div>
    </div>`;
  }).join('');
  // Bookmarks section
  renderBookmarkSection();
  // Weak words section
  renderWeakWordsSection();
}

function renderBookmarkSection(){
  const el = document.getElementById('bookmarkSection');
  if(bookmarks.length === 0){
    el.innerHTML = `<div class="bookmark-section">
      <div class="bookmark-title">★ ブックマーク</div>
      <div class="bookmark-empty">単語カードの★ボタンでブックマークを追加できます</div>
    </div>`;
    return;
  }
  const items = bookmarks.map(fr=>{
    const w = VOCAB.find(v=>v.fr===fr);
    if(!w) return '';
    return `<div class="bookmark-item">
      <span class="bk-fr">${w.fr}</span>
      <span class="bk-ja">${w.ja}</span>
      <button class="bk-remove" onclick="removeBookmark('${escQ(w.fr)}')">✕</button>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="bookmark-section">
    <div class="bookmark-title">★ ブックマーク (${bookmarks.length}語)</div>
    ${items}
  </div>`;
}
function removeBookmark(fr){
  const word = unescQ(fr);
  bookmarks = bookmarks.filter(b=>b!==word);
  localStorage.setItem('fr_bookmarks', JSON.stringify(bookmarks));
  renderStats();
  renderCategoryBar();
  showToast('ブックマーク解除');
}

function renderWeakWordsSection(){
  const el = document.getElementById('weakWordsSection');
  const weakList = Object.entries(weakWords)
    .filter(([k,v]) => v >= 2)
    .sort((a,b) => b[1]-a[1]);
  if(weakList.length === 0){
    el.innerHTML = `<div class="weak-section">
      <div class="weak-title">💪 苦手な単語</div>
      <div style="font-size:0.8rem;color:var(--text3);text-align:center;padding:12px">苦手な単語はまだありません。クイズを続けましょう！</div>
    </div>`;
    return;
  }
  const items = weakList.slice(0,10).map(([fr, cnt])=>{
    const w = VOCAB.find(v=>v.fr===fr);
    if(!w) return '';
    return `<div class="weak-item">
      <span style="color:var(--accent);font-weight:700;flex:1">${w.fr}</span>
      <span style="color:var(--text2);font-size:0.72rem">${w.ja}</span>
      <span style="color:var(--red);font-size:0.65rem;font-weight:700">x${cnt}</span>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="weak-section">
    <div class="weak-title">🔥 苦手な単語 (${weakList.length}語)</div>
    ${items}
    <button class="weak-drill-btn" onclick="startWeakWordsDrill()">⚡ 苦手単語ドリル開始</button>
  </div>`;
}

function exportProgress(){
  const data = {
    progress, quizStats, streakData, bookmarks, weakWords, dailyGoal,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `french-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('エクスポート完了');
}

function importProgress(){
  const input = document.getElementById('importFile');
  input.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(!confirm('現在のデータを上書きしますか？')) return;
        if(data.progress) { progress = data.progress; saveProgress(); }
        if(data.quizStats) { quizStats = data.quizStats; localStorage.setItem('fr_quiz', JSON.stringify(quizStats)); }
        if(data.streakData) { streakData = data.streakData; localStorage.setItem('fr_streak', JSON.stringify(streakData)); }
        if(data.bookmarks) { bookmarks = data.bookmarks; localStorage.setItem('fr_bookmarks', JSON.stringify(bookmarks)); }
        if(data.weakWords) { weakWords = data.weakWords; localStorage.setItem('fr_weak_words', JSON.stringify(weakWords)); }
        if(data.dailyGoal) { dailyGoal = data.dailyGoal; localStorage.setItem('fr_daily_goal', JSON.stringify(dailyGoal)); }
        document.getElementById('streakCount').textContent = streakData.count;
        renderCategoryBar();
        renderFlashcard();
        renderStats();
        updateDailyGoal();
        showToast('インポート完了');
      } catch(err) { showToast('インポートに失敗しました'); }
    };
    reader.readAsText(file);
    input.value = '';
  };
  input.click();
}

function resetAll(){
  progress = {};
  quizStats = {correct:0,total:0};
  streakData = {count:0,lastDate:""};
  bookmarks = [];
  weakWords = {};
  dailyGoal = {target:10,date:"",studied:0};
  localStorage.removeItem('fr_progress');
  localStorage.removeItem('fr_quiz');
  localStorage.removeItem('fr_streak');
  localStorage.removeItem('fr_bookmarks');
  localStorage.removeItem('fr_weak_words');
  localStorage.removeItem('fr_daily_goal');
  document.getElementById('streakCount').textContent = '0';
  renderStats();
  renderCategoryBar();
  renderFlashcard();
  updateDailyGoal();
  showToast('データをリセットしました');
}

// ===== UTILS =====
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ===== TOUCH SWIPE FOR FLASHCARDS =====
let touchStartX = 0;
let touchStartY = 0;
document.getElementById('flashcard').addEventListener('touchstart', e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.getElementById('flashcard').addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50){
    if(dx > 0) prevCard();
    else nextCard();
    e.preventDefault();
  }
});

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', e=>{
  // Only on flashcard tab, and not if input is focused
  if(currentTab !== 'Flashcard') return;
  if(document.activeElement.tagName === 'INPUT') return;
  switch(e.key){
    case 'ArrowLeft': prevCard(); e.preventDefault(); break;
    case 'ArrowRight': nextCard(); e.preventDefault(); break;
    case ' ': flipCard({}); e.preventDefault(); break;
    case '1': rateCard(1); break;
    case '2': rateCard(3); break;
    case '3': rateCard(5); break;
    case 's': case 'S': speakWord(); break;
  }
});

// ===== INIT =====
document.getElementById('streakCount').textContent = streakData.count;
renderCategoryBar();
renderFlashcard();
updateDailyGoal();
</script>
